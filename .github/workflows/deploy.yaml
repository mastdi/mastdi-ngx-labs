name: CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy-tanita:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install Dependencies
        run: npm ci

      - name: Enforce Code Style
        run: npm run lint

      - name: Run Workspace Validation Tests
        run: |
          npx ng test shared-core --watch=false
          npx ng test tanita --watch=false

      - name: Build Production Distribution
        run: npx ng build tanita --configuration production

      - name: Deploy Tanita to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist/tanita/browser --project-name=tanita
