name: CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy-tanita:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm ci

      - name: Enforce Code Style
        run: npm run lint

      - name: Run Workspace Validation Tests
        run: |
          npx ng test shared-core --watch=false
          npx ng test tanita --watch=false

      - name: Build Production Distribution
        run: npx ng build tanita --configuration production

      - name: Deploy Tanita to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: tanita
          directory: dist/tanita/browser
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
