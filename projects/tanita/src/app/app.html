<div class="split-container">
  @switch (currentStatus()) {
    @case ('setup') {
      <app-vault-setup (setupComplete)="currentStatus.set('unlocked')"></app-vault-setup>
    }
    @case ('locked') {
      <app-vault-unlock
        (unlockComplete)="currentStatus.set('unlocked')"
        (storageReset)="evaluateStorageState()">
      </app-vault-unlock>
    }
    @case ('unlocked') {
      <app-vault-dashboard (vaultLocked)="currentStatus.set('locked')"></app-vault-dashboard>
    }
  }
</div>
